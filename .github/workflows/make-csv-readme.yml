name: Actualizar README desde CSV de Make
on:
  push:
    branches: [main]
    paths:
      - 'Backend/BIGDATA/Make/registro_commits.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generar tabla Markdown
        run: python3 Backend/BIGDATA/Make/generar_readme.py
      - name: Publicar README si cambia
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Backend/BIGDATA/Make/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(make): sincronizar README desde CSV'
            git push
          fi
