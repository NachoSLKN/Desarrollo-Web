version: '3'

services:
  tomcat:
    image: tomcat:9.0
    container_name: aplicacionjava
    volumes:
      - ./sample.war:/usr/local/tomcat/webapps/sample.war
    ports:
      - "8080:8080"
    networks:
      - red_tomcat

  nginx:
    image: nginx
    container_name: proxy
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8084:80"
    depends_on:
      - tomcat
    networks:
      - red_tomcat

networks:
  red_tomcat:
