{% extends "base.html" %}

{% block title %}Inicio{% endblock %}

{% block content %}

<section class="relative h-screen flex items-center justify-center text-center">

    <!-- Fondo imagen -->
    <img src="{{ url_for('static', filename='img/seventh_sun.png') }}"
         class="absolute inset-0 w-full h-full object-cover">

    <!-- Overlay oscuro -->
    <div class="absolute inset-0 bg-black bg-opacity-60"></div>

    <!-- Contenido -->
    <div class="relative z-10 text-white">
        <h2 class="text-6xl font-bold mb-6 tracking-widest">
            CATÁLOGO OFICIAL
        </h2>

        <p class="mb-8">
            Gestión completa de álbumes de Bury Tomorrow
        </p>

        <div class="flex justify-center gap-6">
            <a href="{{ url_for('read') }}"
               class="px-8 py-3 border border-white hover:bg-white hover:text-black transition">
                Ver Álbumes
            </a>

            <a href="{{ url_for('add') }}"
               class="px-8 py-3 bg-white text-black hover:bg-gray-300 transition">
                Añadir Álbum
            </a>
        </div>
    </div>

</section>

{% endblock %}
