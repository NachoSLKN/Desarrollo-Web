{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="max-w-md mx-auto py-16">

    <h2 class="text-3xl font-bold text-center mb-8">
        Iniciar Sesión
    </h2>

    <form method="POST" class="bg-gray-900 p-8 rounded-xl shadow-lg space-y-6">

        <div>
            <label class="block mb-2 text-sm">Usuario</label>
            <input type="text" name="username"
                   class="w-full px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none">
        </div>

        <div>
            <label class="block mb-2 text-sm">Contraseña</label>
            <input type="password" name="password"
                   class="w-full px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none">
        </div>

        <button type="submit"
                class="w-full bg-white text-black py-2 rounded hover:bg-gray-300 transition">
            Entrar
        </button>

    </form>

</section>

{% endblock %}
