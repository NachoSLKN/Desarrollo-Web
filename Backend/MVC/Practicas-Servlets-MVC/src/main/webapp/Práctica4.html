<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>




<h1>Formulario</h1>

<form id="miFormulario" action="Controller4">

    <label>Nombre:</label>
    <input type="text" name="nombre">

    <br><br>

    <label>Apellidos:</label>
    <input type="text" name="apellidos">

    <br><br>

    <input type="radio" name="metodo" value="get" checked> GET
    <input type="radio" name="metodo" value="post"> POST

    <br><br>

    <input type="submit" value="Enviar">

</form>


<script>

document.getElementById("miFormulario")
        .addEventListener("submit", function() {

    let metodo =
        document.querySelector(
            'input[name="metodo"]:checked'
        ).value;

    this.method = metodo;

});

</script>

</body>
</html>
